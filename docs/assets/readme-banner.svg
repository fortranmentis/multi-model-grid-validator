<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">From locations to model grids</title>
  <desc id="desc">A schematic of a geographic point connected to an eligible grid cell, representing distance-based matching and temporal screening. This is an illustration, not model output.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b182a"/>
      <stop offset="1" stop-color="#113e4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 H 0 V 38" fill="none" stroke="#5ca6b9" stroke-opacity="0.23" stroke-width="1"/>
    </pattern>
    <clipPath id="panel"><rect x="742" y="44" width="410" height="252" rx="16"/></clipPath>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#background)"/>
  <rect x="48" y="51" width="36" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="86" font-size="12" letter-spacing="2.2" font-weight="600" fill="#8de3e2">GEOSPATIAL / NUMERICAL MODEL DATA</text>
    <text x="46" y="151" font-size="49" font-weight="700" fill="#f1f5f9">From locations</text>
    <text x="46" y="211" font-size="49" font-weight="700" fill="#f1f5f9">to model grids.</text>
    <text x="48" y="259" font-size="18" fill="#a5c7d4">Spatial matching. Temporal screening.</text>
    <text x="48" y="284" font-size="18" fill="#a5c7d4">One consistent table.</text>
  </g>
  <rect x="742" y="44" width="410" height="252" rx="16" fill="#0a2130" stroke="#76bed0" stroke-opacity="0.25"/>
  <g clip-path="url(#panel)">
    <rect x="742" y="44" width="410" height="252" fill="url(#grid)"/>
    <path d="M 750 218 C 792 198 809 228 848 213 S 916 174 950 190 S 1035 230 1150 184" fill="none" stroke="#31869a" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="926" cy="168" r="89" fill="#38bdf8" fill-opacity="0.035" stroke="#7dd3fc" stroke-opacity="0.45" stroke-dasharray="5 6"/>
    <g fill="#5692a3">
      <circle cx="812" cy="92" r="4"/><circle cx="888" cy="92" r="4"/><circle cx="964" cy="92" r="4"/><circle cx="1040" cy="92" r="4"/>
      <circle cx="812" cy="168" r="4"/><circle cx="888" cy="168" r="4"/><circle cx="1040" cy="168" r="4"/>
      <circle cx="812" cy="244" r="4"/><circle cx="888" cy="244" r="4"/><circle cx="964" cy="244" r="4"/><circle cx="1040" cy="244" r="4"/>
    </g>
    <path d="M 926 168 L 984 130" stroke="#5eead4" stroke-width="2.5"/>
    <circle cx="926" cy="168" r="12" fill="#fbbf24" fill-opacity="0.12"/>
    <circle cx="926" cy="168" r="5" fill="#fbbf24"/>
    <rect x="977" y="123" width="14" height="14" rx="3" fill="#5eead4"/>
    <path d="M 959 163 L 969 173 M 969 163 L 959 173" stroke="#e8a1a7" stroke-width="2"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="762" y="70" font-size="11" letter-spacing="1.4" fill="#a5c7d4">POINT TO ELIGIBLE CELL</text>
    <text x="851" y="198" font-size="12" fill="#fcd34d">location</text>
    <text x="1004" y="130" font-size="12" fill="#8cebdc">selected</text>
    <text x="977" y="181" font-size="11" fill="#e8a1a7">excluded</text>
    <text x="762" y="279" font-size="11" fill="#91b1c0">SCHEMATIC / NOT A MODEL OUTPUT</text>
  </g>
</svg>
